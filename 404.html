<style>
  :root { --bg: #060708; --ink: #ecebe6; --mute: #86878c; --accent: #d4ff3a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(70% 60% at 30% 10%, rgba(51, 38, 200, .35), transparent 70%),
                radial-gradient(60% 60% at 85% 30%, rgba(10, 127, 120, .28), transparent 70%), var(--bg);
    color: var(--ink); font: 300 16px/1.55 "Geist", system-ui, sans-serif;
    display: grid; place-items: center; padding: 24px; text-align: center; -webkit-font-smoothing: antialiased;
  }
  .code { font: 500 12px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: .12em; color: var(--mute); text-transform: uppercase; }
  .code i { display: inline-block; width: 7px; height: 7px; margin-right: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); vertical-align: 1px; }
  h1 { margin: 20px 0 14px; font: 500 clamp(44px, 9vw, 96px)/.95 "Geist", sans-serif; letter-spacing: -.045em; }
  h1 em { font: italic 400 1.08em "Instrument Serif", serif; letter-spacing: -.01em; }
  p { margin: 0 auto 32px; max-width: 38ch; color: rgba(236, 235, 230, .72); }
  a { display: inline-flex; align-items: center; gap: 10px; height: 50px; padding: 0 24px; border-radius: 999px; background: var(--ink); color: #0a0a0a; font-weight: 500; text-decoration: none; transition: background .3s; }
  a:hover { background: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <p class="code"><i></i>404 · Signal not found</p>
    <h1>This page is <em>just noise.</em></h1>
    <p>The link may be old or mistyped. Everything worth seeing is on the home page.</p>

  </main>
</body>
